services:
  mongo:
    # Deliberately differs from production (helm/realtime-chat/charts/mongodb/values.yaml):
    # mongod 8.3.4 refuses to start on Linux kernel 6.19+ (e.g. Docker Desktop).
    image: mongodb/mongodb-community-server:8.2.12-ubuntu2204
    # MongoDB 8.x's bundled tcmalloc breaks on Linux kernel 6.19+ (SERVER-121912). The rseq
    # tunable works around it; the image's entrypoint refuses to start on these kernels
    # regardless, so mongod is started directly (mongo-init initiates the replica set).
    entrypoint: ["mongod"]
    command: ["--replSet", "rs0", "--bind_ip_all"]
    environment:
      - GLIBC_TUNABLES=glibc.pthread.rseq=1
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: mongosh --eval "db.adminCommand('ping')" --quiet
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis
    ports:
      - "6379:6379"
    expose:
      - "6379"
  s3mock:
    image: adobe/s3mock:latest
    environment:
      # S3Mock 4.x only reads the long property name; older images used initialBuckets
      - COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS=florians-realtime-chat-bucket
      - initialBuckets=florians-realtime-chat-bucket
    ports:
      - 9090:9090

  mongo-init:
    image: mongodb/mongodb-community-server:8.2.12-ubuntu2204
    depends_on:
      mongo:
        condition: service_healthy
    command: >
      mongosh --host mongo --eval '
        rs.initiate({
          _id: "rs0",
          members: [{ _id: 0, host: "mongo:27017" }]
        })
      '
    restart: on-failure:3

volumes:
  mongo_data: