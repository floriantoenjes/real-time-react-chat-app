name: E2E Tests
on:
  pull_request:
  workflow_call:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: 'read'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Pull the infrastructure images in the background while npm ci runs
      - name: Pull infrastructure images
        working-directory: local-development
        run: nohup docker compose pull --quiet > "$RUNNER_TEMP/compose-pull.log" 2>&1 &

      - name: Install dependencies
        run: npm ci

      - name: Get Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Start infrastructure
        working-directory: local-development
        run: |
          docker compose up -d
          # mongo-init initiates the replica set; wait until it has a primary
          timeout 120 bash -c 'until docker compose exec -T mongo mongosh --quiet --eval "db.hello().isWritablePrimary" | grep -q true; do sleep 2; done'
          # Wait for the bucket itself (HEAD bucket), not just the S3 mock
          timeout 60 bash -c 'until curl -sf -I http://localhost:9090/florians-realtime-chat-bucket > /dev/null; do sleep 2; done' \
            || { echo "S3 mock bucket missing:"; curl -s http://localhost:9090; docker compose logs s3mock; exit 1; }

      - name: Configure backend
        run: |
          cp backend/.example.env backend/.env
          sed -i "s/^JWT_SECRET=.*/JWT_SECRET=$(openssl rand -hex 32)/" backend/.env
          sed -i "s/^COTURN_SECRET=.*/COTURN_SECRET=$(openssl rand -hex 32)/" backend/.env

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
