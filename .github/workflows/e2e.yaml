name: E2E Tests
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: 'read'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Start infrastructure
        working-directory: local-development
        run: |
          docker compose up -d
          # mongo-init initiates the replica set; wait until it has a primary
          timeout 120 bash -c 'until docker compose exec -T mongo mongosh --quiet --eval "db.hello().isWritablePrimary" | grep -q true; do sleep 2; done'
          timeout 60 bash -c 'until curl -sf http://localhost:9090 > /dev/null; do sleep 2; done'

      - name: Configure backend
        run: |
          cp backend/.example.env backend/.env
          sed -i "s/^JWT_SECRET=.*/JWT_SECRET=$(openssl rand -hex 32)/" backend/.env
          sed -i "s/^COTURN_SECRET=.*/COTURN_SECRET=$(openssl rand -hex 32)/" backend/.env

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
