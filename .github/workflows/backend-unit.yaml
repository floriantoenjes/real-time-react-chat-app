name: Backend Unit Tests
on:
  pull_request:
  workflow_call:

concurrency:
  group: backend-unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Jest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: 'read'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck -w backend

      - name: Lint
        run: npm run lint:check -w backend

      - name: Run unit tests
        run: npm test -w backend
