name: Release
on:
  push:
    tags:
      - '*'

# Repository variables (Settings > Secrets and variables > Actions > Variables), values from `terraform output`:
#   GCP_WORKLOAD_IDENTITY_PROVIDER  infra: github_workload_identity_provider
#   GCP_SERVICE_ACCOUNT             infra: github_service_account
#   IMAGE_REPOSITORY                infra: image_repository
#   TF_STATE_BUCKET                 bootstrap: tfstate_bucket
#   DOMAIN                          e.g. floriantoenjes.com
#   LETSENCRYPT_ENVIRONMENT         staging | production
#
# Repository secrets (Settings > Secrets and variables > Actions > Secrets):
#   ACME_EMAIL                      Let's Encrypt account email (a secret only so it is masked in public logs)

jobs:
  backend-unit:
    name: Backend unit tests
    uses: ./.github/workflows/backend-unit.yaml
    permissions:
      contents: 'read'

  frontend-lint:
    name: Frontend lint
    uses: ./.github/workflows/frontend-lint.yaml
    permissions:
      contents: 'read'

  e2e:
    name: E2E tests
    uses: ./.github/workflows/e2e.yaml
    permissions:
      contents: 'read'

  release:
    name: Build image and deploy to GKE
    needs: [backend-unit, frontend-lint, e2e]
    runs-on: ubuntu-latest
    concurrency: deploy

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - id: auth
        name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - id: image
        name: Derive registry host
        env:
          IMAGE_REPOSITORY: ${{ vars.IMAGE_REPOSITORY }}
        run: echo "registry=${IMAGE_REPOSITORY%%/*}" >> "$GITHUB_OUTPUT"

      - name: Login to Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ steps.image.outputs.registry }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: |
            ${{ vars.IMAGE_REPOSITORY }}:${{ github.ref_name }}
            ${{ vars.IMAGE_REPOSITORY }}:latest
          build-args: |
            VITE_PEERJS_SERVER_HOST=peer.${{ vars.DOMAIN }}
            VITE_PEERJS_SERVER_PORT=443
            VITE_TURN_SERVER_URL=turns:turn.${{ vars.DOMAIN }}:5349

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Deploy with Terraform
        working-directory: terraform/k8s
        env:
          TF_VAR_tfstate_bucket: ${{ vars.TF_STATE_BUCKET }}
          TF_VAR_acme_email: ${{ secrets.ACME_EMAIL }}
          TF_VAR_letsencrypt_environment: ${{ vars.LETSENCRYPT_ENVIRONMENT }}
          TF_VAR_image_tag: ${{ github.ref_name }}
        run: |
          terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          terraform apply -input=false -auto-approve
