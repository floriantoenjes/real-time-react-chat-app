{{- if .Values.replicaSet.enabled }}
# Run by the replicaset-init sidecar of every pod; only pod 0 acts. Runs on each pod start,
# so the replica set gets initiated (or resized after a replicaCount change) independently of Helm hooks.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mongodb.fullname" . }}-replicaset-init
  labels:
    {{- include "mongodb.labels" . | nindent 4 }}
data:
  init-replicaset.sh: |
    #!/bin/sh
    set -e

    until mongosh --quiet --norc --eval "db.adminCommand('ping')" >/dev/null 2>&1; do
      echo "Waiting for local mongod..."
      sleep 2
    done

    case "$HOSTNAME" in
      *-0) ;;
      *) echo "Not pod 0, nothing to do"; exec sleep infinity ;;
    esac

    mongosh --quiet --norc --file /scripts/init-replicaset.js
    exec sleep infinity

  init-replicaset.js: |
    const cfg = {
      _id: {{ .Values.replicaSet.name | quote }},
      members: [
        {{- range $i := until (int .Values.replicaCount) }}
        { _id: {{ $i }}, host: "{{ include "mongodb.fullname" $ }}-{{ $i }}.{{ include "mongodb.fullname" $ }}-headless.{{ $.Release.Namespace }}.svc.cluster.local:{{ $.Values.service.port }}" },
        {{- end }}
      ],
    };
    const hosts = (members) => members.map((m) => m.host).sort().join(",");

    let current;
    try {
      current = rs.conf();
    } catch (e) {
      if (e.codeName !== "NotYetInitialized") throw e;
    }

    if (!current) {
      print("No replica set config, initiating...");
      rs.initiate(cfg);
    } else if (hosts(current.members) === hosts(cfg.members)) {
      print("Replica set config is up to date");
    } else {
      // Members changed (replicaCount). Forced, because after scaling down the remaining
      // members have no majority and therefore no primary that could accept a normal reconfig.
      print("Replica set members changed, reconfiguring: " + hosts(cfg.members));
      rs.reconfig(cfg, { force: true });
    }
{{- end }}
