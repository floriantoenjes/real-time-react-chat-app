apiVersion: v1
kind: Secret
metadata:
  name: {{ include "realtime-chat.fullname" . }}-secrets
  labels:
    {{- include "realtime-chat.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.JWT_SECRET | required ".Values.JWT_SECRET is required." | quote }}
  COTURN_SECRET: {{ .Values.coturn.secret | required ".Values.coturn.secret is required." | quote }}
  S3_ACCESS_KEY_ID: {{ .Values.S3_ACCESS_KEY_ID | required ".Values.S3_ACCESS_KEY_ID is required." | quote }}
  S3_SECRET_ACCESS_KEY: {{ .Values.S3_SECRET_ACCESS_KEY | required ".Values.S3_SECRET_ACCESS_KEY is required." | quote }}
