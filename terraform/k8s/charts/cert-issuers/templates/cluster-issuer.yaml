{{- $servers := dict "staging" "https://acme-staging-v02.api.letsencrypt.org/directory" "production" "https://acme-v02.api.letsencrypt.org/directory" -}}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-{{ .Values.environment }}
spec:
  acme:
    email: {{ .Values.email | required "email is required." | quote }}
    server: {{ get $servers .Values.environment | required "environment must be staging or production." }}
    privateKeySecretRef:
      name: letsencrypt-{{ .Values.environment }}-account-key
    solvers:
      - dns01:
          # _acme-challenge.<domain> is a CNAME into the delegated Cloud DNS zone
          cnameStrategy: Follow
          cloudDNS:
            project: {{ .Values.project | required "project is required." | quote }}
            hostedZoneName: {{ .Values.hostedZoneName | required "hostedZoneName is required." | quote }}
